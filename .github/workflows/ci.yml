
name: CI Workflow

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
    
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      
    - name: Use Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '24.x'

    - name: Install NPM dependencies
      run: npm install

    - name: Run ESLint
      run: npx eslint . --ext .js, .ts
      
    - name: Prettify code
      uses: creyD/prettier_action@v4.6
      
    - name: Run NPM dev
      run: npm run test
