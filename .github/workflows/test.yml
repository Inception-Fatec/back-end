name: Unit Test

on:
  push:
    branches: ["main", "dev"]
  pull_request: 
    branches: ["main", "dev"]

jobs:
  unit-test:
    name: Run test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with: 
          node-version: '24.x'
          cache: 'npm'
      
      - name: Install NPM dependencies
        run: npm install

      - name: Run NPM test
        run: npm run test 